name: Foundry website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundry-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      FOUNDRY_SYNC_URL: ${{ vars.FOUNDRY_SYNC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:sync
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4
